services:
  api1: &api
    image: oliveirajhony/rinha-2026-zig:latest
    command: ["/sock/api1.sock", "/dataset.bin"]
    volumes:
      - sockets:/sock
    security_opt:
      - seccomp:unconfined
    networks: [rinha]
    deploy:
      resources:
        limits: { cpus: "0.42", memory: "160MB" }

  api2:
    <<: *api
    command: ["/sock/api2.sock", "/dataset.bin"]

  lb:
    image: oliveirajhony/rinha-2026-zig:latest
    entrypoint: ["/lb"]
    command: ["0.0.0.0:9999", "/sock/api1.sock,/sock/api2.sock"]
    volumes:
      - sockets:/sock
    ports:
      - "9999:9999"
    depends_on: [api1, api2]
    networks: [rinha]
    deploy:
      resources:
        limits: { cpus: "0.16", memory: "30MB" }

volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha:
    driver: bridge
