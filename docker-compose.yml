services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [rinha]
    volumes:
      - sockets:/sock
    command: ["/sock/api1.sock", "/dataset.bin"]
    security_opt:
      - seccomp:unconfined
    cpuset: "0"
    deploy:
      resources:
        limits: { cpus: "0.42", memory: "160MB" }

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [rinha]
    volumes:
      - sockets:/sock
    command: ["/sock/api2.sock", "/dataset.bin"]
    security_opt:
      - seccomp:unconfined
    cpuset: "1"
    deploy:
      resources:
        limits: { cpus: "0.42", memory: "160MB" }

  lb:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/lb"]
    command: ["0.0.0.0:9999", "/sock/api1.sock,/sock/api2.sock"]
    volumes:
      - sockets:/sock
    ports:
      - "9999:9999"
    depends_on: [api1, api2]
    networks: [rinha]
    cpuset: "2,3"
    deploy:
      resources:
        limits: { cpus: "0.16", memory: "30MB" }

volumes:
  sockets:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  rinha:
    driver: bridge
